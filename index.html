<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Sahne Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Koyu, tek temalı uygulama: Metinler → Düzenleyici → Prompter; ayarlar alttan açılan panel. */
:root{
  color-scheme:dark;
  --bg:#0b0d10; --bar:#101318; --surface:#161a20; --surface2:#1e232b; --line:#272d36;
  --fg:#eef0f3; --muted:#8b94a1; --tally:#ff3b2b; --tally-dim:#ff3b2b29; --ok:#3ccf7a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-read:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:max(16px,env(safe-area-inset-left,0px)); --sr:max(16px,env(safe-area-inset-right,0px));
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{font-family:var(--f-read);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Ekran iskeleti ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.nav{flex:none;background:var(--bar);border-bottom:1px solid var(--line);
  padding-top:calc(var(--st) + 6px);padding-bottom:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px}
.nav h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.nav .l{justify-self:start;display:flex;gap:2px}
.nav .r{justify-self:end;display:flex;gap:2px}
.nbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;color:var(--tally);font-size:16px}
.nbtn:active{background:var(--surface2)}
.nbtn.icon{padding:0;justify-content:center}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:var(--sl);padding-right:var(--sr)}
.bottom{flex:none;background:var(--bar);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + var(--sb));padding-left:var(--sl);padding-right:var(--sr)}

/* ---------- Metinler ---------- */
.big-title{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em;margin:18px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;max-width:720px}
.item{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item-main{flex:1;min-width:0;text-align:left;padding:14px 14px 13px;display:flex;flex-direction:column;gap:4px}
.item-main:active,.item-play:active{background:var(--surface2)}
.it-title{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-prev{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.item-play{width:60px;flex:none;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tally)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);line-height:1.5}
.lib-actions{display:flex;gap:10px;max-width:720px}

/* ---------- Butonlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:13px;
  background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:16px;flex:1}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:var(--tally);border-color:var(--tally);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:#ff3b2b66;color:var(--tally)}
.row{display:flex;gap:10px}

/* ---------- Düzenleyici ---------- */
.ed{display:flex;flex-direction:column;gap:10px;padding-top:14px;padding-bottom:14px;max-width:760px;width:100%;margin:0 auto;min-height:100%}
#titleIn{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px 10px;font-family:var(--f-display);font-weight:800;font-size:24px;outline:none}
#titleIn::placeholder,#bodyIn::placeholder{color:#5c6470}
#bodyIn{flex:1;width:100%;min-height:46vh;background:transparent;border:0;resize:none;outline:none;padding:6px 2px;font-size:18px;line-height:1.6}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-family:var(--f-mono);font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-bottom:10px}
.tip{color:var(--muted);font-size:13px}
.tip b{color:var(--tally)}

/* ---------- Alt panel (ayarlar / kayıt) ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet.light{background:#0003}
.panel{width:100%;max-width:640px;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  box-shadow:0 -10px 40px #0009;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 8px 8px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.panel-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(18px + var(--sb))}
.grp-t{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.set{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set-h{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15.5px}
.set-h output{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set input[type=range]{width:100%;accent-color:var(--tally);height:30px;margin:2px 0 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;margin-top:6px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:0 1px 3px #0006}
.tgl{position:relative;width:51px;height:31px;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tgl span{position:absolute;inset:0;border-radius:999px;background:#39404b;transition:background .2s}
.tgl span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px #0005}
.tgl input:checked + span{background:var(--ok)}
.tgl input:checked + span::after{transform:translateX(20px)}
.tgl input:focus-visible + span{outline:2px solid var(--tally);outline-offset:2px}
.set-note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px}
.keys{font-size:14px;color:var(--muted);line-height:1.7;margin:6px 0 0}
.keys kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);background:var(--bg)}

/* Kayıt sonucu */
.recv{width:100%;max-height:46vh;border-radius:12px;background:#000;display:block}
.rec-info{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:10px 2px 4px;font-variant-numeric:tabular-nums}
.rec-actions{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.saved-badge{color:var(--ok);font-size:14px;text-align:center;min-height:20px}

/* Onay penceresi */
.dlg{position:fixed;inset:0;z-index:95;background:#000a;display:flex;align-items:center;justify-content:center;padding-left:var(--sl);padding-right:var(--sr)}
.dlg-box{width:100%;max-width:330px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center}
.dlg-box p{margin:0;padding:20px 18px 18px;font-size:16px;line-height:1.45}
.dlg-box p b{display:block;font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.dlg-row{display:flex;border-top:1px solid var(--line)}
.dlg-row button{flex:1;min-height:48px;font-size:16px;color:#5aa9ff}
.dlg-row button + button{border-left:1px solid var(--line);font-weight:700}
.dlg-row button.red{color:var(--tally)}

.toast{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);z-index:100;background:#fff;color:#000;border-radius:999px;padding:9px 16px;
  font-family:var(--f-mono);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* ---------- Prompter ---------- */
#P{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
#camv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#camv.front{transform:scaleX(-1)}
#dim{position:absolute;inset:0;background:#000;pointer-events:none}
#stage{position:absolute;inset:0;touch-action:none;transform-origin:50% 50%}
#scroller{position:absolute;left:0;right:0;top:0;will-change:transform}
#text{font-family:var(--f-read);font-weight:700;color:#f6f6f4;overflow-wrap:anywhere}
#text p{margin:0 0 .9em}
#text .cue{color:#ff7a6c;font-weight:400;font-size:.6em;letter-spacing:.04em;text-transform:uppercase;display:inline-block;vertical-align:middle;
  border:1.5px solid #ff7a6c88;border-radius:.4em;padding:.05em .45em;margin:0 .1em}
#text.upper{text-transform:uppercase}
#text .endmark{color:#777;font-family:var(--f-mono);font-size:.45em;letter-spacing:.3em;text-align:center;padding-top:1em}
#P.cam #text{text-shadow:0 2px 10px #000,0 0 3px #000}
#P.cam .fade{display:none}
.fade{position:absolute;left:0;right:0;pointer-events:none}
.fade.t{top:0;background:linear-gradient(#000 0%,#000d 35%,transparent)}
.fade.b{bottom:0;height:24%;background:linear-gradient(transparent,#000d 70%,#000)}
#guide{position:absolute;left:0;right:0;height:0;pointer-events:none}
#guide::before{content:"";position:absolute;left:0;right:0;top:0;border-top:1px dashed #ffffff2a}
#guide .ar{position:absolute;top:-11px;width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent}
#guide .l{left:max(4px,env(safe-area-inset-left,0px));border-left:16px solid var(--tally)}
#guide .r{right:max(4px,env(safe-area-inset-right,0px));border-right:16px solid var(--tally)}
#count{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;
  font-size:min(40vw,40vh);background:#000a}
#count span{animation:pop 1s ease-out}
@keyframes pop{from{transform:scale(1.3);opacity:.15}to{transform:none;opacity:1}}

.ptop{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-top:calc(var(--st) + 6px);padding-bottom:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  background:linear-gradient(#000d,#0000);transition:opacity .3s}
.ptop.dim{opacity:.45}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;border-radius:12px;background:#ffffff1a;border:1px solid #ffffff22;color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pbtn.lab{padding:0 14px 0 8px;font-weight:700;font-size:15px}
.pbtn[aria-pressed="true"]{background:#fff;color:#000}
.pbtn:active{filter:brightness(1.4)}
.pmid{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-mono);font-size:13px;color:#ddd;font-variant-numeric:tabular-nums}
.pright{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:#ffffff1c;color:#ddd;letter-spacing:.1em;font-size:11px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#888}
.pill.live i{background:var(--ok)}
.pill.rec{background:#ff3b2b;color:#fff}
.pill.rec i{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.pbot{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;align-items:flex-end;gap:8px;
  padding-top:34px;padding-bottom:calc(14px + var(--sb));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:linear-gradient(#0000,#000d 45%);transition:opacity .3s, transform .3s}
.pbot.hide{opacity:0;transform:translateY(20px);pointer-events:none}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;letter-spacing:.06em;color:#aaa;min-width:0}
.stepper{display:flex;align-items:center;height:44px;border-radius:12px;background:#ffffff1a;border:1px solid #ffffff22;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stepper button{width:34px;height:42px;color:#fff;font-size:17px;font-weight:700}
.stepper button:active{background:#ffffff22}
.stepper b{min-width:36px;text-align:center;font-family:var(--f-mono);font-size:13.5px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.bigbtn{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0008}
.bigbtn svg{width:28px;height:28px;fill:currentColor;stroke:none}
.bigbtn.rec{background:transparent;border:4px solid #fff}
.bigbtn.rec svg{display:none}
.bigbtn.rec::after{content:"";width:48px;height:48px;border-radius:50%;background:var(--tally);transition:all .2s}
.bigbtn.rec.on::after{width:26px;height:26px;border-radius:6px}
.pprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff1a;z-index:6}
.pprog b{display:block;height:100%;width:0;background:var(--tally)}
@media (prefers-reduced-motion: reduce){#count span,.pill.rec i,.panel{animation:none}.ptop,.pbot{transition:none}}
</style>
</head>
<body>

<!-- ===== Metinler ===== -->
<section class="screen" id="scrLib">
  <div class="nav">
    <div class="l"><label class="nbtn" style="position:relative;overflow:hidden">İçe aktar<input id="fileIn" type="file" accept=".txt,text/plain" style="position:absolute;inset:0;opacity:0"></label></div>
    <h1>Prompter</h1>
    <div class="r"><button class="nbtn icon" id="libSet" type="button" aria-label="Ayarlar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div>
  </div>
  <div class="content">
    <h2 class="big-title">Metinler</h2>
    <p class="sub" id="libSub"></p>
    <div class="list" id="list"></div>
  </div>
  <div class="bottom"><div class="lib-actions"><button class="btn primary" id="newBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Yeni metin</button></div></div>
</section>

<!-- ===== Düzenleyici ===== -->
<section class="screen" id="scrEd" hidden>
  <div class="nav">
    <div class="l"><button class="nbtn" id="edBack" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Metinler</button></div>
    <h1>Düzenle</h1>
    <div class="r">
      <button class="nbtn icon" id="edSet" type="button" aria-label="Ayarlar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      <button class="nbtn icon" id="edDel" type="button" aria-label="Metni sil"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </div>
  <div class="content">
    <div class="ed">
      <label for="titleIn" style="position:absolute;left:-9999px">Başlık</label>
      <input id="titleIn" type="text" placeholder="Başlık" autocomplete="off">
      <label for="bodyIn" style="position:absolute;left:-9999px">Metin</label>
      <textarea id="bodyIn" placeholder="Metninizi yazın veya yapıştırın…"></textarea>
      <div class="tip"><b>[Köşeli parantez]</b> içindekiler okunmaz, kırmızı sahne notu olarak görünür.</div>
    </div>
  </div>
  <div class="bottom">
    <div class="meta"><span id="statWords">0 kelime</span><span id="statTime">≈ 0:00</span></div>
    <div class="row">
      <button class="btn" id="readBtn" type="button"><svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4l13 8-13 8z"/></svg>Oku</button>
      <button class="btn primary" id="camBtn" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>Kamerayla çek</button>
    </div>
  </div>
</section>

<!-- ===== Prompter ===== -->
<div id="P" hidden>
  <video id="camv" playsinline muted autoplay hidden></video>
  <div id="dim" hidden></div>
  <div id="stage">
    <div id="scroller"><div id="text"></div></div>
    <div class="fade t" id="fadeT"></div>
    <div class="fade b"></div>
    <div id="guide"><span class="ar l"></span><span class="ar r"></span></div>
  </div>
  <div id="count" hidden></div>

  <div class="ptop" id="ptop">
    <button class="pbtn lab" id="pExit" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Çık</button>
    <div class="pmid"><span class="pill" id="pill"><i></i><span id="pillTxt">HAZIR</span></span><span id="pTime">−0:00</span></div>
    <div class="pright">
      <button class="pbtn" id="pFlip" type="button" aria-label="Ön/arka kamera" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2M20 4v4h-4M4 20v-4h4"/></svg></button>
      <button class="pbtn" id="pCam" type="button" aria-label="Kamera" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg></button>
      <button class="pbtn" id="pSet" type="button" aria-label="Ayarlar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
  </div>

  <div class="pbot" id="pbot">
    <div class="ctrl"><button class="pbtn" id="pRestart" type="button" aria-label="Başa sar"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button><span>BAŞA</span></div>
    <div class="ctrl"><div class="stepper"><button id="pSlow" type="button" aria-label="Yavaşlat">−</button><b id="vSpeed">5.0</b><button id="pFast" type="button" aria-label="Hızlandır">+</button></div><span>HIZ</span></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const SAMPLE = { id:'ornek', title:'Örnek: Ürün tanıtım videosu', body:`[Kameraya bak, gülümse]
Merhaba, ben Deniz. Bugün size kısaca yeni mobil uygulamamızı anlatacağım.

Hepimiz gün içinde onlarca küçük işi aklımızda tutmaya çalışıyoruz. Toplantılar, faturalar, aranacak kişiler. Bir noktada bir şey mutlaka unutuluyor.

[Kısa duraklama]
İşte tam bu yüzden bu uygulamayı geliştirdik. Telefonunuza bir cümle söylüyorsunuz, uygulama onu doğru güne ve doğru saate yerleştiriyor.

[Ekranda uygulama görüntüsü]
Kurulum bir dakikadan kısa sürüyor. Hesap açmanız bile gerekmiyor.

Açıklamadaki bağlantıdan hemen deneyebilirsiniz. İzlediğiniz için teşekkürler.

[Kameraya bak, iki saniye bekle]` };
const DEF = { speed:5, font:40, lh:1.4, margin:6, guide:32, countdown:3, align:'left', mirrorX:false, mirrorY:false, upper:false, fade:true,
  facing:'user', quality:'1080', dim:40, camGuide:16, mic:true };

let scripts = store.get('sp.scripts', null);
if(!Array.isArray(scripts)) scripts = [ {...SAMPLE, updated:Date.now()} ];
let S = Object.assign({}, DEF, store.get('sp.settings', {}));
let curId = null;
const cur = () => scripts.find(s=>s.id===curId);
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ store.set('sp.scripts',scripts); store.set('sp.settings',S); },200); }
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1400); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(sec){ sec=Math.max(0,Math.round(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
const words = b => b.replace(/\[[^\]]*\]/g,' ').split(/\s+/).filter(Boolean).length;
const newId = () => 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* Onay penceresi */
function ask(title,msg,yes){
  return new Promise(res=>{
    $('#dlgMsg').innerHTML='<b>'+esc(title)+'</b>'+esc(msg); $('#dlgYes').textContent=yes||'Sil'; $('#dlg').hidden=false;
    const done=v=>{ $('#dlg').hidden=true; $('#dlgYes').onclick=$('#dlgNo').onclick=null; res(v); };
    $('#dlgYes').onclick=()=>done(true); $('#dlgNo').onclick=()=>done(false);

/* ===== Metinler ===== */
function showScreen(id){ ['scrLib','scrEd'].forEach(s=>$('#'+s).hidden = s!==id); }
function renderLib(){
  const list=$('#list'); list.innerHTML='';
  const sorted=scripts.slice().sort((a,b)=>b.updated-a.updated);
  $('#libSub').textContent = sorted.length ? sorted.length+' metin · bu cihazda saklanıyor' : '';
  if(!sorted.length){ list.innerHTML='<div class="empty">Henüz metin yok.<br>Aşağıdaki <b>Yeni metin</b> ile başlayın veya bir .txt dosyası içe aktarın.</div>'; return; }
  sorted.forEach(s=>{
    const w=words(s.body), d=new Date(s.updated).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
    const prev=s.body.replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim().slice(0,90) || 'Boş metin';
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<button class="item-main" type="button"><span class="it-title">${esc(s.title||'Başlıksız')}</span><span class="it-prev">${esc(prev)}</span><span class="it-meta">${w} kelime · ≈${fmt(w/140*60)} · ${d}</span></button>
      <button class="item-play" type="button" aria-label="Oku"><svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4l13 8-13 8z"/></svg></button>`;

}
$('#newBtn').onclick=()=>{ const s={id:newId(),title:'',body:'',updated:Date.now()}; scripts.push(s); save(); openEditor(s.id); setTimeout(()=>$('#titleIn').focus(),50); };
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const s={id:newId(),title:f.name.replace(/\.[^.]+$/,''),body:String(r.result),updated:Date.now()}; scripts.push(s); save(); toast('İçe aktarıldı'); openEditor(s.id); };
  r.readAsText(f); e.target.value='';
};

/* ===== Düzenleyici ===== */
const titleIn=$('#titleIn'), bodyIn=$('#bodyIn');
function openEditor(id){ curId=id; const c=cur(); titleIn.value=c.title; bodyIn.value=c.body; stats(); showScreen('scrEd'); $('#scrEd .content').scrollTop=0; }
function stats(){ const w=words(bodyIn.value); $('#statWords').textContent=w+' kelime'; $('#statTime').textContent='≈ '+fmt(w/140*60)+' konuşma'; }
titleIn.oninput=()=>{ const c=cur(); c.title=titleIn.value; c.updated=Date.now(); save(); };
bodyIn.oninput=()=>{ const c=cur(); c.body=bodyIn.value; c.updated=Date.now(); stats(); save(); };
function leaveEditor(){
  const c=cur();
  if(c && !c.title.trim() && !c.body.trim()){ scripts=scripts.filter(s=>s!==c); }
  else if(c && !c.title.trim()){ c.title=c.body.trim().split(/\s+/).slice(0,5).join(' ').replace(/\[|\]/g,''); }
  save(); renderLib(); showScreen('scrLib');
}
$('#edBack').onclick=leaveEditor;
$('#edDel').onclick=async()=>{
  if(!await ask('Metin silinsin mi?','Bu işlem geri alınamaz.','Sil')) return;
  scripts=scripts.filter(s=>s.id!==curId); curId=null; save(); renderLib(); showScreen('scrLib'); toast('Silindi');
};
$('#readBtn').onclick=()=>openPrompter(false);
$('#camBtn').onclick=()=>openPrompter(true);

/* ===== Ayarlar ===== */
const SETTINGS = [
  ['Metin', [
    ['font','range','Yazı boyutu',20,140,2,v=>v+' px'],
    ['lh','range','Satır aralığı',1,2.2,0.05,v=>(+v).toFixed(2)],
    ['margin','range','Yan boşluk',0,30,1,v=>v+' %'],
    ['align','seg','Hizalama',[['left','Sola'],['center','Ortaya']]],
    ['upper','tgl','BÜYÜK HARF'],
  ]],
  ['Akış', [
    ['speed','range','Kaydırma hızı',0.5,20,0.5,v=>(+v).toFixed(1)],
    ['countdown','seg','Geri sayım',[[0,'Yok'],[3,'3 sn'],[5,'5 sn']]],
    ['guide','range','Okuma çizgisi (okuma modu)',10,70,1,v=>v+' %'],
    ['fade','tgl','Okunan satırları karart'],
  ]],
  ['Ayna', [
    ['mirrorX','tgl','Yatay ayna (cam düzenek)'],
    ['mirrorY','tgl','Baş aşağı çevir'],
  ]],
  ['Kamera', [
    ['facing','seg','Kamera',[['user','Ön'],['environment','Arka']]],
    ['quality','seg','Kalite',[['720','720p'],['1080','1080p']]],
    ['mic','tgl','Ses kaydet (mikrofon)'],
    ['camGuide','range','Okuma çizgisi (kamera modu)',8,60,1,v=>v+' %'],
    ['dim','range','Görüntü karartma',0,85,5,v=>v+' %'],
  ]],
];
function buildSettings(){
  const body=$('#setBody'); body.innerHTML='';
  SETTINGS.forEach(([g,items])=>{
    const t=document.createElement('div'); t.className='grp-t'; t.textContent=g; body.appendChild(t);
    if(g==='Kamera'){ const n=document.createElement('p'); n.className='set-note'; n.style.margin='0 0 4px'; n.textContent='Ön kamerada metni üstte tutun (okuma çizgisi %10–20), böylece gözünüz objektife yakın olur.'; body.appendChild(n); }
    items.forEach(it=>{
      const [k,type,label]=it, row=document.createElement('div'); row.className='set';
      if(type==='range'){
        const [, , , min,max,step,f]=it;
        row.innerHTML=`<div class="set-h"><label for="set_${k}">${label}</label><output id="out_${k}"></output></div><input id="set_${k}" type="range" min="${min}" max="${max}" step="${step}">`;
        const inp=row.querySelector('input'), out=row.querySelector('output');
        inp.value=S[k]; out.textContent=f(S[k]);
        inp.oninput=()=>{ S[k]=+inp.value; out.textContent=f(inp.value); changed(k); };
      } else if(type==='seg'){
        row.innerHTML=`<div class="set-h"><span>${label}</span></div><div class="seg" role="group" aria-label="${label}"></div>`;
        const seg=row.querySelector('.seg');
        it[3].forEach(([v,l])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=l; b.dataset.v=v; b.id='set_'+k+'_'+v; seg.appendChild(b); });
        const paint=()=>seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v)===String(S[k])));
        paint();
        seg.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S[k]= typeof DEF[k]==='number' ? +b.dataset.v : b.dataset.v; paint(); changed(k); };
      } else {
        row.innerHTML=`<div class="set-h"><label for="set_${k}">${label}</label><span class="tgl"><input id="set_${k}" type="checkbox"><span></span></span></div>`;
        const inp=row.querySelector('input'); inp.checked=!!S[k];
        inp.onchange=()=>{ S[k]=inp.checked; changed(k); };
      }
      body.appendChild(row);
    });
  });
  const kt=document.createElement('div'); kt.className='grp-t'; kt.textContent='Kontroller'; body.appendChild(kt);
  const kp=document.createElement('p'); kp.className='keys';
  kp.innerHTML='Ekrana dokun: oynat / duraklat · Sürükle: ileri-geri<br>Bluetooth klavye/kumanda: <kbd>Boşluk</kbd> oynat, <kbd>↑</kbd><kbd>↓</kbd> hız, <kbd>←</kbd><kbd>→</kbd> atla, <kbd>+</kbd><kbd>−</kbd> yazı, <kbd>R</kbd> kayıt, <kbd>M</kbd> ayna, <kbd>Esc</kbd> çık';
  body.appendChild(kp);
}
function changed(k){
  save();
  if(!$('#P').hidden){
    if((k==='facing'||k==='quality'||k==='mic') && camMode && !recording){ camOff(); camOn(); }
    layout(true);
  }
}
function openSettings(){ if(playing) pause(); buildSettings(); $('#shSet').hidden=false; }
$('#setDone').onclick=()=>{ $('#shSet').hidden=true; };
$('#shSet').addEventListener('click',e=>{ if(e.target.id==='shSet') $('#shSet').hidden=true; });
$('#libSet').onclick=openSettings; $('#edSet').onclick=openSettings; $('#pSet').onclick=openSettings;

/* ===== Prompter ===== */
const P=$('#P'), stage=$('#stage'), scroller=$('#scroller'), textEl=$('#text'), guideEl=$('#guide'), camv=$('#camv');
let offset=0, maxOff=1, guideY=0, lhPx=56, playing=false, elapsed=0, last=0, raf=0, dragging=false, counting=false, cdTimer=0, hideT=0, wakeLock=null, lastTxt=0, ended=false;
let camMode=false, camStream=null, recorder=null, chunks=[], recording=false, recStart=0, recBlob=null, recUrl=null, recSaved=false, recMime='';

function renderText(body){
  const paras=body.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const html=paras.map(p=>'<p>'+esc(p).replace(/\[([^\]\n]+)\]/g,'<span class="cue">$1</span>').replace(/\n/g,'<br>')+'</p>').join('');
  textEl.innerHTML=(html||'<p><span class="cue">Metin boş</span></p>')+'<div class="endmark">— SON —</div>';
}
const pps = () => S.speed*S.font*0.2;

function layout(keep){
  const ratio = maxOff>0 ? offset/maxOff : 0;
  textEl.style.fontSize=S.font+'px'; textEl.style.lineHeight=S.lh; textEl.style.textAlign=S.align;
  textEl.style.paddingLeft=`max(${S.margin}vw, calc(env(safe-area-inset-left,0px) + 24px))`;
  textEl.style.paddingRight=`max(${S.margin}vw, calc(env(safe-area-inset-right,0px) + 24px))`;
  textEl.classList.toggle('upper',!!S.upper);
  stage.style.transform=`scale(${S.mirrorX?-1:1},${S.mirrorY?-1:1})`;
  P.classList.toggle('cam',camMode);
  $('#dim').hidden=!camMode; $('#dim').style.opacity=S.dim/100; camv.hidden=!camMode;
  $('#pCam').setAttribute('aria-pressed',String(camMode)); $('#pFlip').hidden=!camMode;
  $('#vSpeed').textContent=(+S.speed).toFixed(1); $('#vFont').textContent=S.font;
  const vh=stage.clientHeight;
  guideY = vh*(camMode?S.camGuide:S.guide)/100;
  lhPx=S.font*S.lh; guideEl.style.top=guideY+'px';
  const ft=$('#fadeT'); ft.hidden=!S.fade; ft.style.height=Math.max(0,guideY-lhPx*0.9)+'px';
  maxOff=Math.max(1,textEl.offsetHeight-lhPx*1.2);
  if(keep) offset=ratio*maxOff;
  offset=Math.min(Math.max(0,offset),maxOff);
  updateMain(); draw(true);
}
function draw(force){
  scroller.style.transform=`translate3d(0,${(guideY-lhPx/2-offset).toFixed(2)}px,0)`;
  const now=performance.now();
  if(force||now-lastTxt>200){
    lastTxt=now;
    $('#progBar').style.width=(offset/maxOff*100).toFixed(2)+'%';
    $('#pTime').textContent='−'+fmt((maxOff-offset)/pps());
    const pill=$('#pill'), t=$('#pillTxt');
    pill.classList.toggle('rec',recording); pill.classList.toggle('live',playing&&!recording);
    t.textContent = recording ? 'KAYIT '+fmt((now-recStart)/1000) : counting ? 'HAZIRLAN' : playing ? 'OKUNUYOR' : ended ? 'SON' : offset>0 ? 'DURAKLADI' : 'HAZIR';
  }
}
function frame(t){
  const dt=last?Math.min(0.1,(t-last)/1000):0; last=t;
  if(playing&&!dragging){ offset+=pps()*dt; elapsed+=dt; if(offset>=maxOff){ offset=maxOff; ended=true; pause(); } }
  draw(false); raf=requestAnimationFrame(frame);
}
function updateMain(){
  const b=$('#pMain'), l=$('#mainLbl');
  if(camMode){ b.classList.add('rec'); b.classList.toggle('on',recording); l.textContent=recording?'DURDUR':'KAYDET'; b.setAttribute('aria-label',recording?'Kaydı durdur':'Kaydı başlat'); }
  else { b.classList.remove('rec','on'); $('#mainIco').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>'; l.textContent=playing?'DURAKLAT':'OYNAT'; b.setAttribute('aria-label',playing?'Duraklat':'Oynat'); }
}
function controls(){
  clearTimeout(hideT);
  $('#pbot').classList.remove('hide'); $('#ptop').classList.toggle('dim',playing);
  if(playing && !camMode) hideT=setTimeout(()=>$('#pbot').classList.add('hide'),2500);
}

async function lockScreen(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
function unlockScreen(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }

function cancelCount(){ clearTimeout(cdTimer); counting=false; $('#count').hidden=true; }
function play(onGo){
  if(counting) return;
  if(ended||offset>=maxOff-1){ offset=0; elapsed=0; ended=false; }
  lockScreen();
  const go=()=>{ counting=false; $('#count').hidden=true; playing=true; last=0; onGo&&onGo(); updateMain(); controls(); draw(true); };
  if((offset<1||onGo) && S.countdown>0){
    counting=true; let n=S.countdown; const c=$('#count'); c.hidden=false; draw(true);
    const step=()=>{ if(!counting) return; if(n<=0) return go(); c.innerHTML='<span>'+n+'</span>'; n--; cdTimer=setTimeout(step,1000); };
    step();
  } else go();
}
function pause(){ const wasCounting=counting; cancelCount(); playing=false; updateMain(); controls(); draw(true); return wasCounting; }
function toggle(){ if(counting){ pause(); if(recording===false && camMode) {} return; } playing?pause():play(); }
function nudge(n){ offset=Math.min(Math.max(0,offset+n*lhPx),maxOff); ended=false; draw(true); }
function setSpeed(d){ S.speed=Math.min(20,Math.max(0.5,Math.round((S.speed+d)*2)/2)); save(); layout(true); toast('Hız '+S.speed.toFixed(1)); }
function setFont(d){ S.font=Math.min(140,Math.max(20,S.font+d)); save(); layout(true); toast('Yazı '+S.font+' px'); }
function restart(){ pause(); offset=0; elapsed=0; ended=false; draw(true); }

/* Kamera */
async function camOn(){
  if(camStream) return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Bu tarayıcı kamerayı desteklemiyor'); return false; }
  const hi=S.quality==='1080';
  const video={ facingMode:S.facing, width:{ideal:hi?1920:1280}, height:{ideal:hi?1080:720}, frameRate:{ideal:30} };
  try{ camStream=await navigator.mediaDevices.getUserMedia({video, audio:S.mic}); }
  catch(e){
    try{ camStream=await navigator.mediaDevices.getUserMedia({video, audio:false}); if(S.mic) toast('Mikrofon izni yok, sessiz kaydedilecek'); }
    catch(e2){ await ask('Kamera açılamadı','iPhone Ayarlar › Safari › Kamera (ve Mikrofon) iznini "İzin Ver" yapın, sonra tekrar deneyin.','Tamam'); return false; }
  }
  camv.srcObject=camStream; camv.classList.toggle('front',S.facing==='user');
  try{ await camv.play(); }catch(e){}
  return true;
}
function camOff(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } camv.srcObject=null; }
async function setCamMode(on){
  if(recording) return;
  if(on){ if(!await camOn()){ camMode=false; layout(true); return; } camMode=true; }
  else { camOff(); camMode=false; }
  pause(); layout(true);
}
function pickMime(){
  if(!window.MediaRecorder) return null;
  const c=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  for(const m of c){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
async function startRec(){
  if(recording) return;
  if(!camStream && !await camOn()) return;
  const mime=pickMime();
  if(mime===null){ ask('Kayıt desteklenmiyor','Video kaydı için iOS 14.3 veya üstü gerekir.','Tamam'); return; }
  try{ recorder=new MediaRecorder(camStream, mime?{mimeType:mime, videoBitsPerSecond:S.quality==='1080'?10000000:6000000}:{}); }
  catch(e){ try{ recorder=new MediaRecorder(camStream); }catch(e2){ ask('Kayıt başlatılamadı',String(e2.message||e2),'Tamam'); return; } }
  recMime=recorder.mimeType||mime||'video/mp4';
  chunks=[];
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{ recBlob=new Blob(chunks,{type:recMime}); chunks=[]; showRec((performance.now()-recStart)/1000); };
  if(ended||offset>=maxOff-1){ offset=0; ended=false; }
  play(()=>{ try{ recorder.start(1000); recording=true; recStart=performance.now(); }catch(e){ toast('Kayıt başlatılamadı'); } });
}
function stopRec(){
  if(!recording){ return; }
  recording=false;
  try{ recorder.state!=='inactive' && recorder.stop(); }catch(e){}
  pause(); updateMain();
}
function showRec(sec){
  if(recUrl) URL.revokeObjectURL(recUrl);
  recUrl=URL.createObjectURL(recBlob); recSaved=false;
  const v=$('#recv'); v.src=recUrl;
  $('#recDur').textContent='Süre '+fmt(sec);
  $('#recSize').textContent=(recBlob.size/1048576).toFixed(1)+' MB';
  $('#recSaved').textContent='';
  $('#shRec').hidden=false;
}
function recFile(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const ext=recMime.includes('mp4')?'mp4':'webm';
  return new File([recBlob],`prompter-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`,{type:recMime.split(';')[0]});
}
$('#recSave').onclick=async()=>{
  if(!recBlob) return;
  const f=recFile();
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f]}); recSaved=true; $('#recSaved').textContent='✓ Kaydedildi / paylaşıldı'; }
    catch(e){ if(e && e.name!=='AbortError') toast('Kaydedilemedi'); }
  } else {
    const a=document.createElement('a'); a.href=recUrl; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    recSaved=true; $('#recSaved').textContent='✓ İndirildi';
  }
};
async function discardRec(){
  if(recBlob && !recSaved && !await ask('Video kaydedilmedi','Bu çekim silinecek. Emin misiniz?','Sil')) return false;
  $('#recv').removeAttribute('src'); $('#recv').load();
  if(recUrl) URL.revokeObjectURL(recUrl); recUrl=null; recBlob=null; $('#shRec').hidden=true; return true;
}
$('#recClose').onclick=()=>discardRec();
$('#recDel').onclick=async()=>{ recSaved=false; if(await discardRec()) toast('Silindi'); };
$('#recAgain').onclick=async()=>{ if(await discardRec()) restart(); };

/* Aç / kapat */
async function openPrompter(withCam){
  const c=cur(); if(!c) return;
  if(!c.body.trim()){ toast('Önce metin yazın'); return; }
  renderText(c.body);
  P.hidden=false; offset=0; elapsed=0; ended=false; playing=false; camMode=false; last=0;
  cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
  lockScreen();
  await new Promise(r=>requestAnimationFrame(r));
  if(withCam){ camMode = await camOn(); }
  layout(false); controls();
  if(!camMode) play();
}
async function closePrompter(){
  if(recording){ if(!await ask('Kayıt sürüyor','Kaydı durdurup çıkmak istiyor musunuz?','Durdur')) return; stopRec(); return; }
  if(recBlob && !$('#shRec').hidden && !await discardRec()) return;
  pause(); cancelAnimationFrame(raf); camOff(); camMode=false; unlockScreen(); P.hidden=true;
  if(!$('#scrLib').hidden) renderLib();
}
$('#pExit').onclick=closePrompter;
$('#pMain').onclick=()=>{ if(camMode){ recording?stopRec():startRec(); } else toggle(); };
$('#pRestart').onclick=()=>{ if(!recording) restart(); else { offset=0; ended=false; draw(true); } };
$('#pSlow').onclick=()=>{ setSpeed(-0.5); controls(); };
$('#pFast').onclick=()=>{ setSpeed(0.5); controls(); };
$('#pSmall').onclick=()=>{ setFont(-4); controls(); };
$('#pBig').onclick=()=>{ setFont(4); controls(); };
$('#pCam').onclick=()=>{ if(recording){ toast('Önce kaydı durdurun'); return; } setCamMode(!camMode); };
$('#pFlip').onclick=async()=>{ if(recording){ toast('Kayıt sırasında değiştirilemez'); return; } S.facing=S.facing==='user'?'environment':'user'; save(); camOff(); await camOn(); layout(true); };

document.addEventListener('visibilitychange',()=>{
  if(P.hidden) return;
  if(document.visibilityState==='visible'){ lockScreen(); if(camMode && !camStream) camOn(); }
  else { if(recording) stopRec(); else if(playing) pause(); }
});

/* Dokunma ve sürükleme */
let sy=0, so=0, moved=false, pid=null;
stage.addEventListener('pointerdown',e=>{ pid=e.pointerId; dragging=true; moved=false; sy=e.clientY; so=offset; try{stage.setPointerCapture(pid);}catch(_){} });
stage.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==pid) return;
  const dy=e.clientY-sy; if(Math.abs(dy)>8) moved=true;
  if(moved){ offset=Math.min(Math.max(0,so-dy*(S.mirrorY?-1:1)),maxOff); ended=false; draw(true); }
});
const endDrag=e=>{ if(!dragging) return; dragging=false; last=0; if(!moved&&e.type==='pointerup') toggle(); else controls(); };
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{ e.preventDefault(); offset=Math.min(Math.max(0,offset+e.deltaY),maxOff); draw(true); },{passive:false});
$('#count').addEventListener('click',()=>{ if(!recording) pause(); });

/* Klavye / Bluetooth kumanda */
document.addEventListener('keydown',e=>{
  if(P.hidden || !$('#shSet').hidden || !$('#dlg').hidden || !$('#shRec').hidden) return;
  const k=e.key; let h=true;
  if(k===' '||k==='Enter'||k==='MediaPlayPause') toggle();
  else if(k==='ArrowUp') setSpeed(0.5);
  else if(k==='ArrowDown') setSpeed(-0.5);
  else if(k==='ArrowRight'||k==='PageDown') nudge(3);
  else if(k==='ArrowLeft'||k==='PageUp') nudge(-3);
  else if(k==='+'||k==='=') setFont(4);
  else if(k==='-'||k==='_') setFont(-4);
  else if(k==='m'||k==='M'){ S.mirrorX=!S.mirrorX; save(); layout(true); toast(S.mirrorX?'Ayna açık':'Ayna kapalı'); }
  else if((k==='r'||k==='R') && camMode){ recording?stopRec():startRec(); }
  else if(k==='Home') restart();
  else if(k==='Escape') closePrompter();
  else h=false;
  if(h) e.preventDefault();
});
let rT; window.addEventListener('resize',()=>{ if(P.hidden) return; clearTimeout(rT); rT=setTimeout(()=>layout(true),150); });

renderLib();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
</body>
</html>
